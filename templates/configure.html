<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S3 配置</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 600px;">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">配置 S3 存储凭证</h4>
            </div>
            <div class="card-body">
                <!-- 错误及提示信息展示区域 -->
                {% with messages = get_flashed_messages(with_categories=true) %}
                  {% if messages %}
                    {% for category, message in messages %}
                      <div class="alert alert-{{ category if category != 'error' else 'danger' }} alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                      </div>
                    {% endfor %}
                  {% endif %}
                {% endwith %}

                <form action="/configure" method="POST">
                    <div class="mb-3">
                        <label for="aws_access_key_id" class="form-label">AWS Access Key ID *</label>
                        <input type="text" class="form-control" id="aws_access_key_id" name="aws_access_key_id" required>
                    </div>

                    <div class="mb-3">
                        <label for="aws_secret_access_key" class="form-label">AWS Secret Access Key *</label>
                        <input type="password" class="form-control" id="aws_secret_access_key" name="aws_secret_access_key" required>
                    </div>

                    <div class="mb-3">
                        <label for="region_name" class="form-label">Region (默认: us-east-1)</label>
                        <input type="text" class="form-control" id="region_name" name="region_name" value="us-east-1">
                    </div>

                    <div class="mb-3">
                        <label for="endpoint_url" class="form-label">Endpoint URL (兼容 S3/R2/MinIO 时填写，需带 https://)</label>
                        <input type="url" class="form-control" id="endpoint_url" name="endpoint_url" placeholder="https://s3.us-east-1.amazonaws.com">
                    </div>

                    <button type="submit" class="btn btn-primary w-100">保存并连接</button>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
